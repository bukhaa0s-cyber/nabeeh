let live={sec:"flex",lang:"ar",level:1,q:null,pick:null};

function qBlock(){

     <p class="note" style="margin-top:12px">${t.scoreNote}</p></section>
   <section class="blk"><h2>${t.featH}</h2><ul class="feats">${t.feats.map(f=>`<li><div><b>${f[0]}</b><span>${f[1]}</span></div></li>`).join("")}</ul></section>
   <section class="blk"><h2>${t.domH}</h2><p class="intro">${t.domP}</p><div class="domains">${t.doms.map(d=>`<div class="dom" style="--c:${SECC[d[0]]}"><b>${d[1]}</b><span>${d[2]}</span></div>`).join("")}</div></section>
   <section class="blk"><h2>${t.cmpH}</h2><p class="intro">${t.cmpP}</p><div class="compare">${[t.cmpA,t.cmpB].map((c,i)=>`<div class="sheet flat"><b>${c[0]}</b><p class="small muted" style="margin:6px 0 0">${c[1]}</p><div class="ex" dir="${i===0?"rtl":"ltr"}">${c[2]}</div><p class="small" style="margin:0">${c[3]}</p></div>`).join("")}</div></section>
   <section class="blk" id="price"><div class="price"><div><h2>${t.priceH}</h2><p style="margin:10px 0"><span class="tag">${n(C.price.sar)} <small>${t.per}</small></span></p><p class="muted" style="margin:0 0 14px">${t.once}</p>
       <ul class="feats" style="grid-template-columns:1fr">${t.incl.map(x=>`<li><div>${x}</div></li>`).join("")}</ul><div class="ctas" style="margin-top:18px">${buy}<a class="btn ghost" href="app.html">${t.try}</a></div></div>
     <div class="sheet flat"><h2 style="font-size:1.2rem">${t.howH}</h2><ol class="steps3">${t.how.map(x=>`<li><span>${x}</span></li>`).join("")}</ol></div></div></section>
   <section class="blk"><h2>${t.faqH}</h2>${t.faq.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join("")}</section>
   <footer class="site-f"><p><a href="privacy.html">${t.privacy}</a><a href="terms.html">${t.terms}</a>${C.supportEmail?`<a href="mailto:${NB.esc(C.supportEmail)}">${t.contact}</a>`:""}${C.whatsapp?`<a href="https://wa.me/${NB.esc(C.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>`:""}</p><p>${t.disc}</p><p>© ${n(new Date().getFullYear())} ${t.brand}</p></footer>
  </div>`;
}
function refreshLive(){const box=document.querySelector(".live");if(box)box.outerHTML=liveHTML();}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;
  if(a==="lang"){L=L==="ar"?"en":"ar";try{localStorage.setItem("nabeeh.site",L);}catch(x){}live.lang=L;newQ();render();}
  else if(a==="sec"){live.sec=el.dataset.v;newQ();refreshLive();}
  else if(a==="lvl"){live.level=+el.dataset.v;newQ();refreshLive();}
  else if(a==="ql"){live.lang=el.dataset.v;newQ();refreshLive();}
  else if(a==="another"){newQ();refreshLive();}
  else if(a==="pick"){if(live.pick!=null)return;live.pick=+el.dataset.i;refreshLive();const ok=live.pick===live.q.answer,r=document.querySelector(".live .opt.right");
    if(ok){FX.sound.right();FX.burstAt(r,30,1);}else FX.sound.wrong();}
});
document.addEventListener("change",e=>{if(e.target.id==="gsel"){const lv=NB.levelForGrade(+e.target.value);document.querySelectorAll(".levels tr[data-l]").forEach(r=>r.classList.toggle("hl",+r.dataset.l===lv));live.level=lv;newQ();refreshLive();}});
live.lang=L;newQ();render();
})();
</script>
</body>
</html>
