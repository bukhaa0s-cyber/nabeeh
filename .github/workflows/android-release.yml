# Builds the Android app for Google Play on GitHub's Linux runner (no Mac or Android Studio needed).
# Run it from the Actions tab → "Android build" → Run workflow.
#
# Repository secrets (Settings → Secrets and variables → Actions). All optional — without them the run still
# builds an UNSIGNED .aab and a debug-signed .apk you can install on a phone, and only the last check fails.
#   ANDROID_KEYSTORE_BASE64     the upload keystore file (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias inside the keystore
#   ANDROID_KEY_PASSWORD        key password
#   ADMOB_ANDROID_APP_ID        AdMob Android app id (ca-app-pub-…~…). Without it the id in js/config.js is used,
#                               and without that Google's TEST app id.
# Upload to Google Play: no secret needed. The run signs in to Google Cloud project yasalam-play through Workload
# Identity Federation as github-play@yasalam-play.iam.gserviceaccount.com (invited in Play Console → Users and
# permissions). Only workflows of the bukhaa0s-cyber GitHub account can use it.
name: Android build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown on Google Play (e.g. 1.2.1)"
        required: true
        default: "1.3"
      track:
        description: "Google Play track to upload to (none = build only)"
        required: true
        default: alpha
        type: choice
        options: [none, internal, alpha, beta, production]
      release_status:
        description: "Release status on Play (a draft is used automatically if Google only accepts drafts)"
        required: true
        default: completed
        type: choice
        options: [draft, completed]
      require_signed:
        description: "Fail the run if no upload key is configured (the unsigned build is still saved)"
        type: boolean
        default: true
      save_to_branch:
        description: "Also commit the .aab to the 'android-builds' branch (so it can be fetched with git)"
        type: boolean
        default: false
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check generated questions
        run: node tests/check-generators.js 15

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check signing secrets
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "Upload key secrets found: the bundle will be signed."
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned build::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD are not all set. Building an UNSIGNED bundle that Google Play will not accept."
          fi

      - name: Create Android project
        run: npm run build:www && npx cap add android

      - name: Restore upload key
        if: steps.sign.outputs.has == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 --decode > android/app/upload.jks

      - name: Configure Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ steps.sign.outputs.has == 'true' && 'upload.jks' || '' }}
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#0E8A6A' --iconBackgroundColorDark '#0E8A6A' --splashBackgroundColor '#EDF2EE' --splashBackgroundColorDark '#0E191E'
          node scripts/android-config.mjs
          npx cap sync android

      - name: Build bundle (.aab) and test APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug --no-daemon --stacktrace

      - name: Check the merged manifest
        run: |
          f=$(find android/app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "merged manifest: $f"
          cp "$f" merged-AndroidManifest.xml
          grep -o 'uses-permission[^>]*android:name="[^"]*"' "$f" | sed 's/.*android:name=//' | sort -u
          grep -o 'android:targetSdkVersion="[0-9]*"' "$f" || true
          bad=0
          for p in com.google.android.gms.permission.AD_ID android.permission.SCHEDULE_EXACT_ALARM android.permission.USE_EXACT_ALARM; do
            if grep -q "uses-permission[^>]*\"$p\"" "$f"; then echo "::error::$p is still in the merged manifest"; bad=1; fi
          done
          grep -q 'com.google.android.gms.ads.APPLICATION_ID' "$f" || { echo "::error::AdMob APPLICATION_ID meta-data missing"; bad=1; }
          grep -q 'android.permission.POST_NOTIFICATIONS' "$f" || { echo "::error::POST_NOTIFICATIONS missing"; bad=1; }
          exit $bad

      - name: Save bundle, test APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: nabeeh-android-${{ github.run_number }}${{ steps.sign.outputs.has != 'true' && '-UNSIGNED' || '' }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
            merged-AndroidManifest.xml
          if-no-files-found: error

      - name: Save bundle to the android-builds branch
        if: inputs.save_to_branch
        run: |
          mkdir -p /tmp/b && cp android/app/build/outputs/bundle/release/app-release.aab "/tmp/b/nabeeh-${{ inputs.version }}-${{ github.run_number }}.aab"
          cd /tmp/b && git init -q && git checkout -q -b android-builds
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Android bundle ${{ inputs.version }} (run ${{ github.run_number }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-builds

      - name: Sign in to Google (no key file)
        id: gauth
        if: steps.sign.outputs.has == 'true' && inputs.track != 'none'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/734726525070/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-play@yasalam-play.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Google Play (${{ inputs.track }})
        if: steps.gauth.outcome == 'success'
        env:
          PLAY_TOKEN: ${{ steps.gauth.outputs.access_token }}
          ACTION: publish
          PACKAGE: com.bukhari.nabeeh
          AAB: android/app/build/outputs/bundle/release/app-release.aab
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.release_status }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          node scripts/play-api.mjs 2>&1 | tee play.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save the Play log on the play-status branch
        if: always() && steps.gauth.outcome != 'skipped'
        run: |
          [ -f play.txt ] || echo "sign-in failed before the upload" > play.txt
          mkdir -p /tmp/ps && cp play.txt /tmp/ps/ && cd /tmp/ps && git init -q && git checkout -q -b play-status
          git config user.name status-bot && git config user.email status@users.noreply.github.com
          git add play.txt && git commit -qm "Play upload $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" play-status

      - name: Require a signed bundle
        if: steps.sign.outputs.has != 'true' && inputs.require_signed
        run: |
          echo "::error title=Not signed::The build worked, but no upload key is configured, so the .aab is unsigned and Google Play will reject it. Add the four ANDROID_KEY* secrets (see ANDROID.md) and run again. The unsigned bundle and a debug APK are in the run's artifacts."
          exit 1
