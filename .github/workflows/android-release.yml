# Builds the Android app (signed .aab) on GitHub's Linux runner.
# Run it from the Actions tab → "Android build" → Run workflow.
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64     the upload keystore file (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias inside the keystore
#   ANDROID_KEY_PASSWORD        key password
# Optional, to upload straight to Google Play's internal testing track:
#   PLAY_SERVICE_ACCOUNT_JSON   the service-account JSON key from Play Console → API access
name: Android build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown on Google Play (e.g. 1.1.0)"
        required: true
        default: "1.1.0"
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check generated questions
        run: node tests/check-generators.js 15
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Prepare Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
          ANDROID_KEYSTORE_PATH: upload.jks
        run: npm run android:prepare
      - name: Restore upload key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 --decode > android/app/upload.jks
      - name: Build signed bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Save bundle
        uses: actions/upload-artifact@v4
        with:
          name: nabeeh-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play (internal testing)
        if: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bukhari.nabeeh
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
