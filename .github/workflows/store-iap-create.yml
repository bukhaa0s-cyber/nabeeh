# Lists the app's purchases and subscriptions, creates a one-time purchase if missing and sets its price.
# The log is saved on the "iap-create" branch.
name: App Store create purchase
on:
  workflow_dispatch:
    inputs:
      product: { description: "Product id to create (empty = only list)", required: false, default: "" }
      name: { description: "Reference name", required: false, default: "Nabeeh Plus" }
      price: { description: "Customer price in SAU (empty = leave it)", required: false, default: "" }
      ar_name: { description: "Arabic name", required: false, default: "نبيه بلس" }
      ar_desc: { description: "Arabic description", required: false, default: "اختبارات وتقرير كامل وخطة، بدون إعلانات" }
      en_name: { description: "English name", required: false, default: "Nabeeh Plus" }
      en_desc: { description: "English description", required: false, default: "Mock tests, full report, plan, no ads" }
      shot: { description: "Review screenshot in the repo", required: false, default: "store/iap/nabeeh-plus-review.png" }
      replace_shot: { description: "1 = replace the review screenshot", required: false, default: "0" }
      dry_run: { description: "1 = only report", required: false, default: "0" }
permissions: { contents: write }
jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Create
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          PRODUCT: ${{ inputs.product }}
          NAME: ${{ inputs.name }}
          AR_NAME: ${{ inputs.ar_name }}
          AR_DESC: ${{ inputs.ar_desc }}
          EN_NAME: ${{ inputs.en_name }}
          EN_DESC: ${{ inputs.en_desc }}
          DRY_RUN: ${{ inputs.dry_run }}
          REVIEW_SHOT: ${{ inputs.shot }}
          REPLACE_SHOT: ${{ inputs.replace_shot }}
        run: |
          set -o pipefail
          node scripts/asc-iap-create.mjs 2>&1 | tee log.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Price
        if: inputs.product != '' && inputs.dry_run != '1' && inputs.price != ''
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          PRODUCT: ${{ inputs.product }}
          PRICE: ${{ inputs.price }}
          TERRITORY: SAU
        run: |
          set -o pipefail
          node scripts/asc-iap-price.mjs 2>&1 | tee -a log.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save on the iap-create branch
        if: always()
        run: |
          [ -f log.txt ] || exit 0
          git config user.name status-bot; git config user.email status@users.noreply.github.com
          git checkout --orphan iap-create; git rm -rfq --cached .; git add -f log.txt
          git commit -qm "IAP create $(date -u +%FT%TZ)"; git push -f origin iap-create
