# Prints the App Store state of the versions, builds and purchases, and saves it on the "status" branch. Read-only on Apple's side.
name: App Store status
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Status
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: node scripts/asc-status.mjs | tee status.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save on the status branch
        run: |
          git config user.name status-bot; git config user.email status@users.noreply.github.com
          git checkout --orphan status; git rm -rfq --cached .; git add -f status.txt
          git commit -qm "App Store status $(date -u +%FT%TZ)"; git push -f origin status
