# Creates (or reuses) an App Store version and writes its release notes from store/release-notes.json.
# Run it from the Actions tab → "App Store version" → Run workflow.
name: App Store version
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to prepare (e.g. 1.3)"
        required: true
      promo:
        description: "Also refresh the promotional text from store/promo.json"
        type: boolean
        default: false
      dry_run:
        description: "Only report what would change"
        type: boolean
        default: false
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare the version
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          VERSION: ${{ inputs.version }}
          PROMO: ${{ inputs.promo && '1' || '0' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/asc-version.mjs 2>&1 | tee out.txt
      - name: Publish the output
        if: always()
        run: |
          git config user.name "nabeeh-bot"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan status2 || true
          cp out.txt status.txt 2>/dev/null || echo "no output" > status.txt
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f status.txt
          git commit -qm "version run $(date -u +%FT%TZ)" || true
          git push -f origin HEAD:refs/heads/status || true
